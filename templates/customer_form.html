{% extends 'base.html' %}
{% block title %}{{ title }} - Huden Platform{% endblock %}

{% block content %}
<div class="content-section fade-in p-8">
    <div class="mb-8">
        <h2 class="text-4xl font-bold text-slate-800 mb-2">{{ title }}</h2>
        <p class="text-slate-600 text-lg">{{ subtitle }}</p>
    </div>

    <div class="bg-white rounded-2xl shadow-xl p-8 max-w-4xl mx-auto">
        <form method="post">
            {% csrf_token %}
            <div class="space-y-6">
                {% for field in form %}
                    <div class="fieldWrapper">
                        {{ field.errors }}
                        <label for="{{ field.id_for_label }}" class="block text-sm font-semibold text-slate-700 mb-2">{{ field.label }}</label>
                        {{ field }}
                    </div>
                {% endfor %}
            </div>
            <div class="mt-8 flex justify-end space-x-4">
                <a href="{% url 'core:customer_list' %}" class="bg-slate-500 hover:bg-slate-600 text-white px-6 py-3 rounded-xl font-semibold transition-colors shadow-lg">
                    Cancelar
                </a>
                <button type="submit" class="btn-corporate-primary text-white px-8 py-3 rounded-xl font-semibold shadow-lg hover-scale">
                    <i class="fas fa-save mr-2"></i>Guardar
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
