{% extends 'base.html' %}
{% block title %}{{ title }} - Huden Platform{% endblock %}

{% block content %}
<div class="content-section fade-in p-8">
    <div class="mb-8">
        <h2 class="text-4xl font-bold text-slate-800 mb-2">{{ title }}</h2>
    </div>

    <div class="bg-white rounded-2xl shadow-xl p-8 max-w-4xl mx-auto text-center">
        <p class="text-lg text-slate-700 mb-8">{{ confirm_message }}</p>
        <form method="post">
            {% csrf_token %}
            <div class="flex justify-center space-x-4">
                <a href="{{ request.META.HTTP_REFERER|default:'/' }}" class="bg-slate-500 hover:bg-slate-600 text-white px-6 py-3 rounded-xl font-semibold transition-colors shadow-lg">
                    Cancelar
                </a>
                <button type="submit" class="bg-red-600 hover:bg-red-700 text-white px-8 py-3 rounded-xl font-semibold shadow-lg hover-scale">
                    Sí, eliminar
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
