{% extends "base.html" %}
{% block title %}Enviar Correo - {{ pedido.numero_pedido }}{% endblock %}
{% block page_title %}Enviar Correo - Pedido {{ pedido.numero_pedido }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7">
        <div class="card">
            <div class="card-header"><i class="bi bi-envelope me-2"></i>Enviar Correo</div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Destinatario</label>
                        <input type="email" name="destinatario" class="form-control"
                            value="{{ pedido.cliente.correo if pedido.cliente else '' }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Asunto</label>
                        <input type="text" name="asunto" class="form-control"
                            value="Pedido {{ pedido.numero_pedido }} - {{ pedido.cliente.nombre if pedido.cliente else '' }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Mensaje</label>
                        <textarea name="mensaje" class="form-control" rows="8" required>Estimado cliente,

Se informa el estado del pedido {{ pedido.numero_pedido }}.

Cliente: {{ pedido.cliente.nombre if pedido.cliente else '' }}
Producto: {{ pedido.producto_principal or '' }}
Cantidad: {{ pedido.cantidad_total }}
Estado: {{ pedido.estado_despacho }}

Quedo atento.</textarea>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary"><i class="bi bi-send me-1"></i>Enviar</button>
                        <a href="{{ url_for('pedidos.detalle', id_pedido=pedido.id_pedido) }}" class="btn btn-secondary">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
